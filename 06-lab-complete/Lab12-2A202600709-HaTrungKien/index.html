<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoffeeHolic – AI Cafe Recommender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --cream:   #FAF6F0;
      --latte:   #E8D5B7;
      --mocha:   #C4956A;
      --espresso:#7B4F2E;
      --dark:    #3D2314;
      --rust:    #A0522D;
    }

    * { box-sizing: border-box; }

    body {
      background: #2C1810;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ── Phone shell ── */
    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      background: var(--cream);
      border-radius: 48px;
      border: 11px solid #1a0e08;
      box-shadow: 0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 430px) {
      body { background: var(--cream); align-items: flex-start; }
      .phone { width: 100vw; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--dark);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 26px;
      background: #1a0e08;
      border-radius: 50px;
    }
    .status-icons { display: flex; gap: 4px; align-items: center; }

    /* ── Screen system ── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: opacity .35s ease, transform .35s ease;
    }
    .screen.hidden { opacity: 0; pointer-events: none; }
    .screen.slide-up   { transform: translateY(100%); }
    .screen.slide-down { transform: translateY(-100%); }

    /* ══════════════════════════════════════
       SCREEN 1 – INTRO
    ══════════════════════════════════════ */
    #screen-intro {
      background: linear-gradient(160deg, #F5ECD7 0%, #E8D5B7 40%, #D4B896 100%);
    }

    .intro-texture {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(122,79,46,.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(122,79,46,.10) 0%, transparent 50%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%237B4F2E' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }

    .intro-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0 32px;
    }

    .coffee-ring {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 2px solid rgba(123,79,46,.15);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .coffee-ring:nth-child(2) { width: 230px; height: 230px; border-color: rgba(123,79,46,.2); }
    .coffee-ring:nth-child(3) { width: 180px; height: 180px; border-color: rgba(123,79,46,.25); }

    .coffee-cup-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(145deg, #A0622D, #7B4F2E);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px rgba(123,79,46,.4), 0 4px 12px rgba(123,79,46,.3);
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 800;
      color: var(--espresso);
      text-align: center;
      line-height: 1.1;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }
    .brand-subtitle {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--mocha);
      text-align: center;
      letter-spacing: 0.5px;
      margin-bottom: 48px;
      position: relative;
      z-index: 1;
    }

    .btn-start {
      width: 100%;
      max-width: 280px;
      padding: 18px 0;
      background: linear-gradient(135deg, #A0522D, #7B4F2E);
      color: #FAF6F0;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(123,79,46,.45), 0 2px 8px rgba(123,79,46,.25);
      transition: all .2s ease;
      position: relative;
      z-index: 1;
    }
    .btn-start:hover  { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(123,79,46,.5); }
    .btn-start:active { transform: translateY(0px);  box-shadow: 0 4px 16px rgba(123,79,46,.4); }

    .intro-bottom-hint {
      padding: 16px;
      text-align: center;
      font-size: 11px;
      color: var(--mocha);
      letter-spacing: 0.3px;
      font-family: 'Lora', serif;
      font-style: italic;
    }

    /* ══════════════════════════════════════
       SCREEN 2 – SWIPE
    ══════════════════════════════════════ */
    #screen-swipe {
      background: var(--cream);
    }

    .swipe-header {
      padding: 12px 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      margin-top: 42px;
    }
    .swipe-logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--espresso);
    }
    .like-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFF8F0;
      border: 1.5px solid #E8D5B7;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--espresso);
    }
    .like-counter .hearts { display: flex; gap: 3px; }
    .like-counter .heart-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ddd;
      transition: background .25s;
    }
    .like-counter .heart-dot.filled { background: #E74C3C; }

    /* Deck */
    .deck-wrap {
      flex: 1;
      position: relative;
      margin: 8px 16px 0;
      overflow: hidden;
    }

    .cafe-card {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 32px rgba(61,35,20,.14), 0 2px 8px rgba(61,35,20,.08);
      cursor: grab;
      user-select: none;
      touch-action: none;
      display: flex;
      flex-direction: column;
      transition: box-shadow .2s;
    }
    .cafe-card:active { cursor: grabbing; box-shadow: 0 16px 48px rgba(61,35,20,.2); }

    /* Info bar at top of card */
    .card-info-top {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 5;
      padding: 14px 15px 13px;
      background: rgba(247, 248, 249, .92);
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(61, 35, 20, .12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .card-cafe-name {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .card-stars { display: flex; align-items: center; gap: 4px; margin-bottom: 5px; }
    .card-stars span { font-size: 11px; font-weight: 600; color: var(--espresso); margin-left: 2px; }
    .card-address {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--mocha);
      font-weight: 500;
    }

    .card-photo {
      flex: 1;
      object-fit: cover;
      width: 100%;
      pointer-events: none;
      display: block;
    }

    /* Stamp overlays */
    .stamp {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 10px 22px;
      border-radius: 12px;
      border: 4px solid;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity .1s;
    }
    .stamp-like  { left: 20px;  color: #27ae60; border-color: #27ae60; transform: translateY(-50%) rotate(-10deg); }
    .stamp-nope  { right: 20px; color: #e74c3c; border-color: #e74c3c; transform: translateY(-50%) rotate(10deg); }

    /* Background cards stacked */
    .cafe-card.bg-card-1 {
      transform: scale(0.96) translateY(14px);
      z-index: 1;
      pointer-events: none;
    }
    .cafe-card.bg-card-2 {
      transform: scale(0.92) translateY(28px);
      z-index: 0;
      pointer-events: none;
    }
    .cafe-card.top-card { z-index: 3; }

    /* Empty state */
    .deck-empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--mocha);
    }
    .deck-empty p { font-size: 14px; text-align: center; line-height: 1.5; }

    /* Recommend CTA: hidden until the user likes at least one cafe */
    .recommend-cta-wrap {
      display: none;
      padding: 10px 20px 0;
      flex-shrink: 0;
    }
    .recommend-cta-wrap.visible {
      display: block;
    }
    .btn-recommend {
      width: 100%;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #A0522D, #7B4F2E);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .3px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(123, 79, 46, .30);
      transition: transform .15s, opacity .2s, box-shadow .2s;
    }
    .btn-recommend:hover {
      opacity: .92;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(123, 79, 46, .36);
    }
    .btn-recommend:active {
      transform: scale(.98);
    }

    /* Action bar */
    .action-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      padding: 14px 0 20px;
      flex-shrink: 0;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .action-btn:hover  { transform: scale(1.08); }
    .action-btn:active { transform: scale(0.93); }

    .btn-nope {
      width: 62px; height: 62px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(231,76,60,.2);
      border: 2px solid rgba(231,76,60,.18);
      color: #e74c3c;
    }
    .btn-love {
      width: 74px; height: 74px;
      background: linear-gradient(135deg, #A0522D, #7B4F2E);
      box-shadow: 0 6px 24px rgba(123,79,46,.45);
      color: #fff;
    }
    .btn-location {
      width: 62px; height: 62px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(52,152,219,.18);
      border: 2px solid rgba(52,152,219,.18);
      color: #3498db;
    }

    /* ══════════════════════════════════════
       SCREEN 3 – LOADING (analyzing)
    ══════════════════════════════════════ */
    #screen-loading {
      background: var(--cream);
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .loading-ring-wrap {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
    }
    @keyframes ring-pulse {
      0%,100% { transform: scale(1);   opacity: .2; }
      50%      { transform: scale(1.2); opacity: .5; }
    }
    .lring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--mocha);
    }
    .lring:nth-child(1) { animation: ring-pulse 1.8s ease-in-out infinite; }
    .lring:nth-child(2) { inset: 18px; animation: ring-pulse 1.8s ease-in-out infinite .4s; }
    .lring:nth-child(3) { inset: 36px; animation: ring-pulse 1.8s ease-in-out infinite .8s; }
    .lring-center {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #A0522D, #7B4F2E);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(123,79,46,.4);
      position: relative;
      z-index: 1;
    }
    @keyframes bounce-icon {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .lring-center svg { animation: bounce-icon 1.4s ease-in-out infinite; }

    .loading-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--espresso);
      margin-bottom: 8px;
      text-align: center;
    }
    .loading-status {
      font-size: 13px;
      color: var(--mocha);
      text-align: center;
      min-height: 20px;
      letter-spacing: 0.2px;
    }
    .loading-bar-wrap {
      width: 140px;
      height: 4px;
      background: #E8D5B7;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 24px;
    }
    @keyframes loading-bar {
      0%   { width: 5%; }
      60%  { width: 80%; }
      100% { width: 95%; }
    }
    .loading-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #A0522D, #7B4F2E);
      border-radius: 10px;
      animation: loading-bar 3s ease-out forwards;
    }

    /* ══════════════════════════════════════
       SCREEN 4 – RESULTS LIST
    ══════════════════════════════════════ */
    #screen-results {
      background: var(--cream);
      overflow-y: auto;
    }
    #screen-results::-webkit-scrollbar { display: none; }

    .results-header {
      padding: 16px 20px 14px;
      margin-top: 40px;
    }
    .results-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--espresso);
    }
    .results-header p {
      font-size: 13px;
      color: var(--mocha);
      margin-top: 4px;
      font-family: 'Lora', serif;
      font-style: italic;
    }

    .results-tag-row {
      display: flex;
      gap: 8px;
      padding: 0 20px 16px;
      flex-wrap: wrap;
    }
    
    .vibe-tag {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: #EFE0CC;
      color: var(--espresso);
      border: 1.5px solid #E0C9A8;
      letter-spacing: 0.3px;
    }

    .result-cards-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 16px 24px;
    }

    .result-card {
      background: #fff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(61,35,20,.08);
      border: 1.5px solid #EFE0CC;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      display: flex;
      flex-direction: column;
    }
    .result-card:hover  { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(61,35,20,.14); }
    .result-card:active { transform: scale(0.98); }

    .result-card-img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }

    .result-card-body {
      padding: 14px 16px 16px;
    }
    .result-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .result-cafe-name {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1.2;
      flex: 1;
    }
    .match-badge {
      background: linear-gradient(135deg, #A0522D, #7B4F2E);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      margin-left: 10px;
      flex-shrink: 0;
    }
    .result-stars { display: flex; align-items: center; gap: 3px; margin-bottom: 8px; }
    .result-stars span { font-size: 12px; font-weight: 600; color: var(--espresso); margin-left: 4px; }
    .result-address {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--mocha);
      margin-bottom: 10px;
    }
    .result-reason {
      font-size: 12px;
      color: #6B4226;
      line-height: 1.5;
      padding: 10px 12px;
      background: #FFF8F0;
      border-radius: 12px;
      border-left: 3px solid var(--mocha);
    }
    .result-action-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-maps-small {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 16px;
      background: #EFE0CC;
      color: var(--espresso);
      border: none;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-maps-small:hover { background: #E0C9A8; }
    .btn-detail-small {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #A0522D, #7B4F2E);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-detail-small:hover { opacity: .88; }

    .results-back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 16px 12px;
      padding: 10px 16px;
      background: transparent;
      color: var(--mocha);
      border: 1.5px solid #E8D5B7;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .results-back-btn:hover { background: #EFE0CC; }

    /* ══════════════════════════════════════
       SCREEN 5 – CAFE DETAIL
    ══════════════════════════════════════ */
    #screen-detail {
      background: var(--cream);
      overflow-y: auto;
    }
    #screen-detail::-webkit-scrollbar { display: none; }

    .detail-hero {
      position: relative;
      height: 260px;
      flex-shrink: 0;
    }
    .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .detail-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(61,35,20,.35) 0%, transparent 40%, rgba(61,35,20,.75) 100%);
    }
    .detail-back {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 38px; height: 38px;
      background: rgba(250,246,240,.88);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--espresso);
      transition: transform .15s;
    }
    .detail-back:active { transform: scale(.9); }
    .detail-match-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(123,79,46,.88);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
    }
    .detail-hero-info {
      position: absolute;
      bottom: 14px;
      left: 16px;
      right: 16px;
    }
    .detail-hero-name {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
      text-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .detail-hero-cat {
      font-size: 11px;
      color: rgba(255,255,255,.8);
      margin-top: 3px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .detail-body { padding: 0 16px 32px; }

    .detail-section {
      background: #fff;
      border-radius: 20px;
      padding: 16px;

     JAVASCRIPT
════════════════════════════════════════════════════════ -->
<script>
/* ── Clock ── */
function updateClock() {
  const n = new Date();
  let h = n.getHours(), m = n.getMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clock').textContent = `${h}:${String(m).padStart(2,'0')} ${ap}`;
}
updateClock();
setInterval(updateClock, 1000);

/* ── Cafe dataset (30 cafes, 3D vector: [cozy-green, minimal-study, vintage-warm]) ── */
/* ── Cafe dataset loaded from data/cafes.jsonl ── */
let ALL_CAFES = [];

async function loadCafesFromJsonl() {
  const response = await fetch("./data/cafes.jsonl");

  if (!response.ok) {
    throw new Error(
      `Cannot load cafes.jsonl: ${response.status} ${response.statusText}`
    );
  }

  const text = await response.text();

  ALL_CAFES = text
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line, index) => {
      try {
        const cafe = JSON.parse(line);

        return {
          id: cafe.id ?? `c${String(index + 1).padStart(2, "0")}`,
          name: cafe.name ?? "Unknown cafe",
          address: cafe.address ?? "",
          rating: Number(cafe.rating ?? 0),
          category:
            cafe.category ??
            cafe.categories?.[0] ??
            "Cafe",

          img:
            cafe.img ??
            cafe.picture ??
            cafe.image_url ??
            "",

          maps:
            cafe.maps ??
            cafe.google_maps_url ??
            `https://maps.google.com/?q=${encodeURIComponent(
              `${cafe.name ?? ""} ${cafe.address ?? ""}`
            )}`,

          vec:
            cafe.vec ??
            cafe.vector ??
            cafe.embedding ??
            [0, 0, 0],

          description: cafe.description ?? "",
          songs: cafe.songs ?? [],
        };
      } catch (error) {
        throw new Error(
          `Invalid JSON at cafes.jsonl line ${index + 1}: ${error.message}`
        );
      }
    });

  if (ALL_CAFES.length === 0) {
    throw new Error("cafes.jsonl does not contain any cafe records.");
  }

  console.log(`Loaded ${ALL_CAFES.length} cafes from cafes.jsonl`);
}

/* Vibe match reasons per slot */
const REASONS = {
  high:   'This cafe closely matches your selected vibes — expect the exact atmosphere you were looking for.',
  medium: 'A great blend of your preferred vibes with a few unique surprises you might enjoy.',
  low:    'A fresh pick from our dataset that touches on some elements of your vibe choices.',
};

/* ── App state ── */
let deck         = [];   // shuffled cafes for swiping
let deckIndex    = 0;    // pointer into deck
let likedCafes   = [];   // cafes the user hearted
let topResults   = [];   // computed recommendations (array of cafe objects with .similarity)
let currentDetailCafe = null;
let selectionCount = 0;     // Tổng số lượt đã chọn: Like + Nope
let choiceLocked = false;   // Chặn bấm hoặc swipe nhiều lần
let analysisStarted = false;

/* ── Navigation ── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

function goBack(target) {
  showScreen(target);
}

/* ── Screen 1 → 2 ── */
async function goToSwipe() {
  try {
    if (ALL_CAFES.length === 0) {
      await loadCafesFromJsonl();
    }

    deck = [...ALL_CAFES].sort(() => Math.random() - 0.5);
    deckIndex = 0;
    likedCafes = [];
    topResults = [];

    selectionCount = 0;
    choiceLocked = false;
    analysisStarted = false;

    updateDots();
    renderDeck();
    showScreen("screen-swipe");
  } catch (error) {
    console.error(error);
    alert(error.message);
  }
}

/* ── Render top 3 cards ── */
function renderDeck() {
  const wrap = document.getElementById('deck');
  // Remove existing cards (not the empty state div)
  wrap.querySelectorAll('.cafe-card').forEach(c => c.remove());

  const remaining = deck.slice(deckIndex);
  if (remaining.length === 0) {
    document.getElementById('deck-empty').style.display = 'flex';
    return;
  }
  document.getElementById('deck-empty').style.display = 'none';

  // Render up to 3 cards, bottom to top
  const toRender = remaining.slice(0, 3).reverse();
  toRender.forEach((cafe, i) => {
    const isTop = (i === toRender.length - 1);
    const card = buildCard(cafe, isTop, toRender.length - 1 - i);
    wrap.appendChild(card);
  });

  if (remaining.length > 0) {
    attachSwipe(wrap.querySelector('.top-card'), deck[deckIndex]);
  }
}

function buildCard(cafe, isTop, stackPos) {
  const el = document.createElement('div');
  el.className = 'cafe-card ' + (isTop ? 'top-card' : (stackPos === 1 ? 'bg-card-1' : 'bg-card-2'));
  el.dataset.id = cafe.id;

  // Stars HTML
  const starsFull = Math.floor(cafe.rating);
  let starsHTML = '';
  for (let i = 0; i < 5; i++) {
    const filled = i < starsFull ? 'currentColor' : 'none';
    starsHTML += `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="${filled}" stroke="#C4956A" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
  }

  el.innerHTML = `
    <div class="card-info-top">
      <div class="card-cafe-name">${cafe.name}</div>
      <div class="card-stars">${starsHTML}<span>${cafe.rating}</span></div>
      <div class="card-address">
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        ${cafe.address}
      </div>
    </div>
    <img class="card-photo" src="${cafe.img}" alt="${cafe.name}" loading="lazy" draggable="false">
    <div class="stamp stamp-like">LIKE</div>
    <div class="stamp stamp-nope">NOPE</div>
  `;
  return el;
}

/* ── Swipe gesture ── */
function attachSwipe(cardEl, cafe) {
  if (!cardEl) return;
  let sx = 0, sy = 0, dragging = false;

  const onStart = e => {
    dragging = true;
    const p = e.touches ? e.touches[0] : e;
    sx = p.clientX; sy = p.clientY;
    cardEl.style.transition = 'none';
  };
  const onMove = e => {
    if (!dragging) return;
    if (e.cancelable) e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - sx;
    const dy = p.clientY - sy;
    const rot = dx * 0.07;
    cardEl.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg)`;
    // stamps
    const like = cardEl.querySelector('.stamp-like');
    const nope = cardEl.querySelector('.stamp-nope');
    if (dx > 20) { like.style.opacity = Math.min((dx-20)/80,1); nope.style.opacity = 0; }
    else if (dx < -20) { nope.style.opacity = Math.min((-dx-20)/80,1); like.style.opacity = 0; }
    else { like.style.opacity = 0; nope.style.opacity = 0; }
  };
  const onEnd = e => {
    if (!dragging) return;
    dragging = false;
    const p = e.changedTouches ? e.changedTouches[0] : e;
    const dx = p.clientX - sx;
    cardEl.style.transition = 'transform .35s cubic-bezier(.25,.8,.25,1), opacity .25s';
    if (dx > 100) { doLike(cardEl, cafe); }
    else if (dx < -100) { doNope(cardEl, cafe); }
    else {
      cardEl.style.transform = '';
      cardEl.querySelectorAll('.stamp').forEach(s => s.style.opacity = 0);
    }
  };

  cardEl.addEventListener('mousedown', onStart);
  cardEl.addEventListener('touchstart', onStart, {passive:true});
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
}

/*
  Match rules:
  1. Người dùng luôn chọn tối thiểu 3 lượt đầu tiên.
  2. Sau lượt thứ 3, nếu đã có ít nhất 1 Like -> loading ngay.
  3. Nếu 3 lượt đầu đều Nope -> tiếp tục chọn và loading ngay khi xuất hiện Like đầu tiên.

  Vector dùng để match luôn là trung bình vector của toàn bộ cafe trong likedCafes.
*/
function shouldStartAnalysis() {
  // Chỉ match sau khi đã chọn ít nhất 3 lượt và đã Like ít nhất 1 cafe.
  // Bao gồm:
  // - Like/Nope/Nope -> loading sau pick 3
  // - Nope/Like/Nope -> loading sau pick 3
  // - Nope/Nope/Like -> loading sau pick 3
  // - Like/Like/Like -> loading sau pick 3
  // - Nope/Nope/Nope/.../Like -> loading ngay tại lượt Like đầu tiên
  return selectionCount >= 3 && likedCafes.length > 0;
}

function finishChoice(cardEl) {
  setTimeout(() => {
    cardEl.remove();

    // The user may have clicked Recommend while the Like animation was running.
    // In that case, do not start another flow or re-render the pick screen.
    if (analysisStarted) return;

    if (shouldStartAnalysis()) {
      analysisStarted = true;
      startAnalysis();
      return;
    }

    choiceLocked = false;
    renderDeck();
  }, 320);
}
/* ── Like / Nope helpers ── */
function doLike(cardEl, cafe) {
  if (choiceLocked || analysisStarted) return;

  choiceLocked = true;

  cardEl.style.transform = 'translate(600px,-50px) rotate(25deg)';
  cardEl.style.opacity = '0';

  likedCafes.push(cafe);
  deckIndex++;
  selectionCount++;

  updateDots();
  finishChoice(cardEl);
}

function doNope(cardEl, cafe) {
  if (choiceLocked || analysisStarted) return;

  choiceLocked = true;

  cardEl.style.transform = 'translate(-600px,-50px) rotate(-25deg)';
  cardEl.style.opacity = '0';

  deckIndex++;
  selectionCount++;

  updateDots();
  finishChoice(cardEl);
}

/* ── Button handlers ── */
function handleLike() {
  const top = document.querySelector('.top-card');
  if (!top) return;
  const cafe = deck[deckIndex];
  top.style.transition = 'transform .35s cubic-bezier(.25,.8,.25,1), opacity .25s';
  doLike(top, cafe);
}
function handleNope() {
  const top = document.querySelector('.top-card');
  if (!top) return;
  const cafe = deck[deckIndex];
  top.style.transition = 'transform .35s cubic-bezier(.25,.8,.25,1), opacity .25s';
  doNope(top, cafe);
}
function handleLocation() {
  const cafe = deck[deckIndex];
  if (cafe) window.open(cafe.maps, '_blank');
}

/* ── Recommend immediately from the cafes already liked ── */
function handleRecommend() {
  if (likedCafes.length === 0 || analysisStarted) return;

  analysisStarted = true;
  choiceLocked = true;
  updateRecommendButton();

  // Skip additional picks and show the match screen immediately.
  // When exactly one cafe is liked, its vector is used directly.
  computeResults();
  showResults();
}

/* ── Like dots ── */
function updateDots() {
  const likeCount = likedCafes.length;

  ['dot-1', 'dot-2', 'dot-3'].forEach((id, i) => {
    document
      .getElementById(id)
      .classList.toggle('filled', i < likeCount);
  });

  document.getElementById('like-label').textContent =
    `${likeCount} liked · ${selectionCount} picks`;

  updateRecommendButton();
}

function updateRecommendButton() {
  const wrap = document.getElementById('recommend-cta-wrap');
  if (!wrap) return;

  const canRecommend = likedCafes.length > 0 && !analysisStarted;
  wrap.classList.toggle('visible', canRecommend);
}

/* ── Analysis flow ── */
function startAnalysis() {
  updateRecommendButton();
  showScreen('screen-loading');
  // Reset loading bar animation
  const bar = document.getElementById('loading-bar');
  bar.style.animation = 'none';
  void bar.offsetWidth; // reflow
  bar.style.animation = 'loading-bar 3s ease-out forwards';

  const steps = [
    'Analyzing your vibe…',
    'Processing aesthetic patterns…',
    'Running similarity embeddings…',
    'Finding your perfect match…',
    'Almost there…',
  ];
  let i = 0;
  const el = document.getElementById('loading-txt');
  el.textContent = steps[0];
  const interval = setInterval(() => {
    i++;
    if (i < steps.length) el.textContent = steps[i];
  }, 600);

  setTimeout(() => {
    clearInterval(interval);
    computeResults();
    showResults();
  }, 3200);
}

/* ── Cosine similarity ── */
function cosine(a, b) {
  let dot=0, na=0, nb=0;
  for (let i=0;i<a.length;i++) { dot+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i]; }
  if (!na||!nb) return 0;
  return dot / (Math.sqrt(na)*Math.sqrt(nb));
}

function computeResults() {
  // User vector = average of liked cafes vectors
  const userVec = [0,0,0];
  likedCafes.forEach(c => { c.vec.forEach((v,i) => userVec[i] += v); });
  userVec.forEach((_,i) => userVec[i] /= likedCafes.length);

  // Score ALL cafes (exclude already-liked from results if you want clean results)
  const likedIds = new Set(likedCafes.map(c=>c.id));
  const scored = ALL_CAFES
    .filter(c => !likedIds.has(c.id))
    .map(c => ({ ...c, similarity: cosine(userVec, c.vec) }))
    .sort((a,b) => b.similarity - a.similarity);

  topResults = scored.slice(0, 3);
}

/* ── Render results ── */
function showResults() {
  showScreen('screen-results');

  // Tags from liked cafes
  const tagEl = document.getElementById('results-tags');
  tagEl.innerHTML = '';
  likedCafes.forEach(c => {
    const t = document.createElement('div');
    t.className = 'vibe-tag';
    t.textContent = c.category;
    tagEl.appendChild(t);
  });

  // Description
  document.getElementById('results-desc').textContent =
    `Matched from ${likedCafes.map(c=>c.name.split(' ')[0]).join(', ')} vibes`;

  // Cards
  const list = document.getElementById('results-list');
  list.innerHTML = '';

  topResults.forEach((cafe, idx) => {
    const pct = Math.round(cafe.similarity * 100);
    const reasonKey = pct >= 75 ? 'high' : pct >= 50 ? 'medium' : 'low';
    const reason = REASONS[reasonKey];

    // Stars
    const starsFull = Math.floor(cafe.rating);
    let starsHTML = '';
    for (let i=0;i<5;i++) {
      const fill = i < starsFull ? '#C4956A' : 'none';
      starsHTML += `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="${fill}" stroke="#C4956A" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
    }

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
      <img class="result-card-img" src="${cafe.img}" alt="${cafe.name}" loading="lazy">
      <div class="result-card-body">
        <div class="result-card-top">
          <div class="result-cafe-name">${cafe.name}</div>
          <div class="match-badge">${pct}% match</div>
        </div>
        <div class="result-stars">${starsHTML}<span>${cafe.rating}</span></div>
        <div class="result-address">
          <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#C4956A" stroke-width="2.2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ${cafe.address}
        </div>
        <div class="result-reason">${reason}</div>
        <div class="result-action-row">
          <button class="btn-maps-small" onclick="window.open('${cafe.maps}','_blank')">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
            Google Maps
          </button>
          <button class="btn-detail-small" onclick="openDetail('${cafe.id}')">
            View Details →
          </button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

/* ── Cafe detail ── */
function openDetail(cafeId) {
  const cafe = topResults.find(c => c.id === cafeId) || ALL_CAFES.find(c => c.id === cafeId);
  if (!cafe) return;
  currentDetailCafe = cafe;

  const pct = Math.round((cafe.similarity || 0.8) * 100);
  document.getElementById('d-img').src    = cafe.img;
  document.getElementById('d-img').alt    = cafe.name;
  document.getElementById('d-name').textContent    = cafe.name;
  document.getElementById('d-cat').textContent     = cafe.category;
  document.getElementById('d-match').textContent   = `${pct}% Match`;
  document.getElementById('d-address').textContent = cafe.address;
  document.getElementById('d-rating').textContent  = `${cafe.rating} / 5.0`;
  document.getElementById('d-category').textContent= cafe.category;
  document.getElementById('d-maps-btn').onclick    = () => window.open(cafe.maps, '_blank');

  const reasonKey = pct >= 75 ? 'high' : pct >= 50 ? 'medium' : 'low';
  document.getElementById('d-reason').textContent = REASONS[reasonKey];

  // Spectrum bars
  const labels = ['Cozy & Green', 'Minimalist Study', 'Vintage & Warm'];
  const colors  = ['#4ade80', '#60a5fa', '#fbbf24'];
  const spectrum = document.getElementById('d-spectrum');
  spectrum.innerHTML = '';
  cafe.vec.forEach((v, i) => {
    const pctV = Math.round(v * 100);
    spectrum.innerHTML += `
      <div class="spectrum-item">
        <div class="spectrum-label"><span>${labels[i]}</span><span>${pctV}%</span></div>
        <div class="spectrum-bar-bg"><div class="spectrum-bar-fill" style="width:${pctV}%;background:linear-gradient(90deg,${colors[i]},${colors[i]}99)"></div></div>
      </div>`;
  });

  // Busy chart (mock per cafe)
  const busyData = [
    { label:'8AM',  h: 30 },
    { label:'10AM', h: 55 },
    { label:'12PM', h: 90 },
    { label:'2PM',  h: 75 },
    { label:'4PM',  h: 60 },
    { label:'6PM',  h: 85 },
    { label:'8PM',  h: 40 },
  ];
  const busy = document.getElementById('d-busy');
  busy.innerHTML = '';
  busyData.forEach(b => {
    busy.innerHTML += `
      <div class="busy-bar-col">
        <div class="busy-bar" style="height:${b.h * 0.65}px"></div>
        <div class="busy-bar-label">${b.label}</div>
      </div>`;
  });

  showScreen('screen-detail');
}

/* ── Toast ── */
function toast(msg, type='info') {
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function backToPicking() {
  analysisStarted = false;
  choiceLocked = false;

  renderDeck();
  updateDots();
  showScreen('screen-swipe');
}

/* init icons */
document.addEventListener('DOMContentLoaded', () => {
  if (window.lucide) lucide.createIcons();
});
</script>
